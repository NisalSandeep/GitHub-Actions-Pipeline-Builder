services:
  github-actions-pipeline-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: github-actions-pipeline-studio
    image: github-actions-pipeline-studio:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      org.opencontainers.image.title: "GitHub Actions Pipeline Studio"
      org.opencontainers.image.description: "Interactive visual GitHub Actions pipeline generator and YAML architect"
